services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:55432:5432'
    environment:
      POSTGRES_USER: clair
      POSTGRES_PASSWORD: clair_local_demo
      POSTGRES_DB: clair
    volumes:
      - clair-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clair -d clair']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  clair-postgres:
